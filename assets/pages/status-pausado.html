    <h1>Cadastro pausado por você</h1>
    <p>Você pausou o cadastro do seu empreendimento. Seus itens não aparecem na busca enquanto a pausa durar — nada é apagado.</p>
    <p>Use a pausa em férias ou períodos sem produção. Para voltar a aparecer na plataforma, basta reativar.</p>
    <div class="status-acoes">
